[project]
name = "simple-commerce-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.1",
    "django-mcp-server>=0.5.7",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "mcp<1.10",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "django-silk>=5.5.2",
    "factory-boy>=3.3.3",
    "pytest-django>=4.14.0",
]
